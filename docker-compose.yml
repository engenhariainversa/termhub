# termhub
#
#   Infra só (Postgres + Mailpit) e app rodando no host com "npm run dev":
#     docker compose up -d
#
#   Tudo no Docker com hot-reload (server + web em bind mount):
#     docker compose --profile dev up --build
#     → app http://localhost:5173 · API http://localhost:3000 · Mailpit http://localhost:8025
#
#   Produção (imagem otimizada, Fastify serve o build do frontend; blue/green atrás do proxy):
#     bash deploy/blue-green.sh
#     → sem porta de host: o proxy nginx fala com o container ativo pela rede "proxy"
#
# ATENÇÃO: dentro do Docker a máquina "local" é o container. Para abrir terminais
# no próprio host, cadastre-o como máquina SSH (host.docker.internal). O container
# gera sua própria chave SSH no primeiro boot (volume "sshkeys"); a chave pública
# aparece na tela de nova máquina e em (prod, blue/green):
#   docker exec termhub-app-$(cat /mnt/hd2tb/projetos/termhub/active-color) cat /home/app/.ssh/id_ed25519.pub

# Nome fixo: volumes/containers ficam "termhub_*" independentemente do diretório (CI faz checkout em outro lugar).
name: termhub

# Shared config for the prod blue/green pair (see services.app-blue / app-green below).
x-app: &app
  profiles: ["prod"]
  build:
    context: .
    dockerfile: Dockerfile
    # Firebase Analytics for the web app: same values as the landing, baked into the
    # bundle at build time (see the landing service below). Empty = no analytics.
    args:
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
      VITE_BUILD_SHA: ${VITE_BUILD_SHA:-}
  image: termhub-app
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER:-termhub}:${POSTGRES_PASSWORD:-termhub}@db:5432/${POSTGRES_DB:-termhub}
    # SMTP: no .env use SMTP_HOST=mailpit (caixa local) ou um SMTP real
    SEED_LOCAL_MACHINE: ${SEED_LOCAL_MACHINE:-false}
    TZ: ${TZ:-America/Sao_Paulo}
    # voice input: the whisper service below (same compose network); unset to turn the mic off
    WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}
    WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
    # chat decision memory: the embed service below (same compose network). EMBED_URL falls back to it
    # when unset, so an empty EMBED_SECRET is what turns suggestions off.
    EMBED_URL: ${EMBED_URL:-http://embed:8000}
    EMBED_SECRET: ${EMBED_SECRET:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - sshkeys:/home/app/.ssh
    # chat attachments (spec 2026-09-26 §8): shared by blue and green, so a deploy never loses a file
    - chat-files:/data/chat-files
  depends_on:
    db:
      condition: service_healthy
  # SIGTERM starts the drain (spec 2026-09-27 §5.2); 30 s bounds it before Docker kills the process.
  stop_grace_period: 30s
  healthcheck:
    # ready = the database answers and the process is not draining (/api/health only says the process is up)
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ready || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  db:
    # postgres:16-alpine + pgvector (docker/db). Not recreated by blue-green.sh (it runs with --no-deps):
    # switching a running server to this image is a manual step (spec 2026-09-26 §3.1).
    build: docker/db
    image: termhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-termhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-termhub}
      POSTGRES_DB: ${POSTGRES_DB:-termhub}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caixa de e-mail local: recebe os códigos de login em dev. UI em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ── Speech-to-text for the terminals' voice input (docker/whisper): faster-whisper on CPU ──
  # Shared by dev and the blue/green pair like the db; the app works without it (mic hidden).
  # Model weights land in the "whisper-models" volume on first start (small ≈ 500 MB, medium ≈ 1.5 GB).
  # First boot takes a minute or two while it downloads — the app answers 503 for the mic until then.
  whisper:
    profiles: ["dev", "prod"]
    build: docker/whisper
    image: termhub-whisper
    restart: unless-stopped
    environment:
      # medium: ~3x realtime on 6 cores, best pt-BR (punctuation, names); small: ~10x realtime, rougher.
      # large-v3/turbo were measured worse in Portuguese (no punctuation, skipped passages) and slower.
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      # 0 = one thread per physical core (hyperthreads slow CTranslate2 down)
      WHISPER_THREADS: ${WHISPER_THREADS:-0}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
    volumes:
      - whisper-models:/models

  # ── Text embeddings for the chat's decision memory (docker/embed): fastembed on CPU ──
  # Shared by dev and the blue/green pair like whisper; the app works without it (no suggestions).
  # Weights (~500 MB) land in the "embed-models" volume on first start.
  embed:
    profiles: ["dev", "prod"]
    build: docker/embed
    image: termhub-embed
    restart: unless-stopped
    environment:
      # Empty = the service refuses every request and the chat suggests nothing. openssl rand -base64 32
      EMBED_SECRET: ${EMBED_SECRET:-}
    volumes:
      - embed-models:/models

  # ── Dev: hot-reload (tsx watch + vite) ─────────────────────────────
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-termhub}:${POSTGRES_PASSWORD:-termhub}@db:5432/${POSTGRES_DB:-termhub}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SEED_LOCAL_MACHINE: "false"
      VITE_HOST: 0.0.0.0
      TZ: ${TZ:-America/Sao_Paulo}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      EMBED_URL: ${EMBED_URL:-http://embed:8000}
      EMBED_SECRET: ${EMBED_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - sshkeys-dev:/root/.ssh
      - chat-files-dev:/data/chat-files
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── Prod: blue/green pair behind the proxy, switched by deploy/blue-green.sh
  # for zero-downtime deploys. Same image tag on both (built once, reused);
  # only the container name differs — no host port: the proxy nginx reaches
  # whichever container is active over the "proxy" docker network (see
  # docker-compose.proxy.yml). ─────────────────────────────────────────
  app-blue:
    <<: *app

  app-green:
    <<: *app

  # ── Prod: landing page (termhub.dev), static nginx built from apps/landing ──
  landing:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      # Firebase Analytics: Vite bakes these into the static bundle at build time,
      # so the landing image must be rebuilt whenever they change. Empty = no analytics.
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    image: termhub-landing
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  sshkeys:
  sshkeys-dev:
  whisper-models:
  chat-files:
  chat-files-dev:
  embed-models:
