name: Publish @termhub/agent

# Publishes apps/agent to npm. A bump of the version in apps/agent/package.json landing on main
# is the release: the `decide` job compares that version with what npm already has and, when it
# is new, publishes and creates the matching agent-vX.Y.Z tag. Pushing the tag by hand still
# works (and is what the tag trigger is for), as does running this workflow manually; a version
# already on npm is skipped, so none of the three paths can publish twice.
#
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub — the package's
# "Trusted publisher" on npmjs.com must point at this repository and this workflow file.
# Provenance is attached automatically.
on:
  push:
    branches: [main]
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: write # the tag this workflow creates after a publish from main
  id-token: write

# Two pushes to main a minute apart both passed `decide` before either had published, and the
# second publish failed with "You cannot publish over the previously published versions" (run
# 36671373847): the publish job takes minutes, and npm takes a while to show a new version. One
# run at a time, never cancelled (a cancelled run could stop halfway through a publish).
concurrency:
  group: publish-agent
  cancel-in-progress: false

jobs:
  # ── Is this version still missing from npm? ────────────────────────
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: check
        name: Versão do pacote x versão no npm
        run: |
          v=$(node -p 'require("./apps/agent/package.json").version')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "@termhub/agent@$v" version >/dev/null 2>&1; then
            echo "@termhub/agent@$v já está no npm; nada a publicar"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo "@termhub/agent@$v ainda não está no npm"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No registry-url here: with it, setup-node writes an _authToken placeholder into .npmrc
      # and npm takes the token path instead of the OIDC exchange ("OIDC permission denied").
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Atualizar npm (trusted publishing precisa de npm >= 11.5)
        run: npm install -g npm@latest && npm --version
      - name: Instalar dependências
        run: npm ci
      - name: Build dos pacotes compartilhados e do agente
        run: npm run build:packages && npm run build -w @termhub/agent
      - name: Testes do agente
        run: npm test -w @termhub/agent
      - name: Tag bate com a versão do pacote
        if: github.ref_type == 'tag'
        run: |
          v=$(node -p 'require("./apps/agent/package.json").version')
          [ "${GITHUB_REF_NAME#agent-v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != package version $v"; exit 1; }
      - name: Manifesto publicado não depende de @termhub/*
        run: node -e 'const d=Object.keys(require("./apps/agent/package.json").dependencies||{});if(d.some(x=>x.startsWith("@termhub/"))){console.error("workspace dependency in dependencies:",d);process.exit(1)}'
      - name: Tarball mantém o bin termhub-agent
        run: |
          npm pack -w @termhub/agent --pack-destination /tmp >/dev/null
          tar -xOf /tmp/termhub-agent-*.tgz package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s).bin||{};if(b["termhub-agent"]!=="dist/cli.js"){console.error("bin missing in tarball:",b);process.exit(1)}console.log("bin ok:",b)})'
      # `decide` may have looked before npm showed a version another run had just published: that
      # version being there already is the outcome we wanted, not a failure. npm holds a CI publish
      # as "staged" (invisible to `npm view`) until a maintainer approves it with 2FA, and a publish
      # in that window answers "Cannot publish over previously staged version": the same case. Any
      # other error fails.
      - name: Publicar (trusted publishing / OIDC)
        id: publish
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          if out=$(npm publish -w @termhub/agent --access public --provenance 2>&1); then
            printf '%s\n' "$out"
            echo 'published=true' >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qiE 'EPUBLISHCONFLICT|cannot publish over (the )?previously (published|staged)'; then
            printf '%s\n' "$out"
            echo "@termhub/agent@${{ needs.decide.outputs.version }} já estava no npm; nada a publicar"
            echo 'published=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out"
            exit 1
          fi
      # Keeps the tag history even when the release came from a bump on main. A tag pushed with
      # GITHUB_TOKEN does not start another run, so this cannot loop back into itself. Only after a
      # publish of this run: the run that published the version already pushed its tag.
      - name: Marcar a versão publicada (agent-vX.Y.Z)
        if: github.ref == 'refs/heads/main' && steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "agent-v$VERSION"
          git push origin "agent-v$VERSION"
