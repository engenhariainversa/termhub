name: CI e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'epic/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a run on main: it could be mid-switch_proxy/retire_old; queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Verificação: typecheck + build (GitHub-hosted, .github/workflows/check.yml) ──
  check:
    uses: ./.github/workflows/check.yml

  # ── Deploy no jarvis (runner self-hosted) ──────────────────────────
  deploy:
    needs: check
    # workflow_dispatch: re-run a deploy of main without an empty commit (e.g. to prove a deploy keeps terminals up).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, termhub]
    timeout-minutes: 30
    env:
      # .env de produção vive só no servidor (segredos não passam pelo GitHub)
      ENV_FILE: /mnt/hd2tb/projetos/termhub/.env
      STATE_FILE: /mnt/hd2tb/projetos/termhub/active-color
    steps:
      - uses: actions/checkout@v4
      - name: Conferir .env do servidor
        run: test -f "$ENV_FILE" || { echo "faltando $ENV_FILE (copie de .env.example)"; exit 1; }
      - name: Landing (build + recreate the static container)
        run: docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.proxy.yml --profile prod up -d --build --no-deps landing
      - name: Whisper (speech-to-text service; recreated only when its image or config changes)
        run: docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.proxy.yml --profile prod up -d --build --no-deps whisper
      - name: Embed (text embeddings for the chat memory; recreated only when its image or config changes)
        run: docker compose --env-file "$ENV_FILE" -f docker-compose.yml -f docker-compose.proxy.yml --profile prod up -d --build --no-deps embed
      - name: Deploy blue-green (build, healthcheck, switch nginx, retire old)
        run: bash deploy/blue-green.sh
      - name: Conferir migrations aplicadas
        run: docker exec "termhub-app-$(cat "$STATE_FILE")" npx --prefix apps/server prisma migrate status --config apps/server/prisma.config.ts
      - name: Limpar imagens antigas
        if: always()
        run: docker image prune -f
