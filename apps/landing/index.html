          "@type": "FAQPage",
          "@id": "https://termhub.dev/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "O que é o termhub?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Um painel no navegador para os terminais das suas máquinas. Você conecta cada máquina com o agente do termhub, organiza por projeto e abre tabs; cada tab é uma sessão tmux na máquina, que continua rodando quando você fecha o navegador."
              }
            },
            {
              "@type": "Question",
              "name": "Preciso instalar algo no computador que uso para acessar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não. Basta um navegador: funciona no notebook, no tablet e no celular. A instalação fica do outro lado: o servidor do termhub (um docker compose) e, em cada máquina que você quer acessar, o agente (@termhub/agent) com tmux."
              }
            },
            {
              "@type": "Question",
              "name": "Como conecto uma máquina?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Instale o agente com npm i -g @termhub/agent (precisa de Node 20+ e tmux; no Linux, também make, g++ e python3, porque o npm compila o node-pty — a tela Adicionar máquina mostra o comando completo para Linux e macOS), gere um token em Máquinas › Adicionar máquina e rode o termhub-agent connect que o app mostra. Depois, termhub-agent service install deixa o agente rodando em segundo plano (launchd no macOS, systemd no Linux). A conexão sai da máquina por WebSocket: não precisa abrir porta, configurar SSH nem estar na mesma rede."
              }
            },
            {
              "@type": "Question",
              "name": "É seguro? Onde ficam as credenciais?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "O agente abre uma conexão de saída até o servidor, então nenhuma porta fica exposta na máquina. O token de pareamento aparece uma vez só e o servidor guarda apenas o hash dele; o servidor nunca manda texto de shell para o agente, só pede operações nomeadas (abrir um terminal, listar sessões…). Para mostrar os limites das contas de IA, o login do CLI é lido na máquina na hora da consulta: nenhum token de IA é armazenado e o conteúdo dos terminais nunca é logado."
              }
            },
            {
              "@type": "Question",
              "name": "Funciona com o Claude Code?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, e foi feito pensando nele: cole imagens e arraste arquivos direto no terminal, dite o prompt por voz (a transcrição roda no seu servidor) e selecione e copie mesmo com o app usando o mouse. Codex, Gemini CLI, Antigravity ou qualquer outra CLI rodam do mesmo jeito, porque é um terminal de verdade."
              }
            },
            {
              "@type": "Question",
              "name": "Como sei quando o agente de IA precisa de mim?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Instale os hooks do monitor na máquina, com um clique no app. Quando o Claude Code ou o Codex termina de responder ou para esperando uma permissão, a tab ganha um ponto laranja, o projeto é marcado na barra lateral e um aviso aparece no canto da tela. A home lista tudo o que está esperando você, agrupado por máquina."
              }
            },
            {
              "@type": "Question",
              "name": "Funciona no Windows?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Para acessar, sim: é só abrir o navegador. Como máquina de destino, o agente roda em macOS e Linux e precisa de tmux; no Windows, use o WSL."
              }
            },
            {
              "@type": "Question",
              "name": "É grátis?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. O termhub é open source sob licença MIT: rode na sua rede com quantas máquinas e usuários quiser. O termhub Cloud, hospedado por nós, está em beta gratuito e depois será a opção paga para quem não quer manter servidor."
              }
            },
            {
              "@type": "Question",
              "name": "O que é o termhub Cloud?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A mesma experiência sem servidor para manter: você conecta suas máquinas com o agente e acessa de qualquer lugar, com login, times e permissões prontos. Está em beta gratuito, e o acesso é liberado em ordem de inscrição."
              }
            },

                "text": "O código está no GitHub. Issues, PRs e ideias são bem-vindos; o README explica como rodar em desenvolvimento."
              }
            }
