# Static landing. Hashed assets are cached for a year; index.html is not.
# Every location includes the security headers: an add_header in a location discards the
# server-level ones (security-headers.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Unhashed public files (icons, social preview, brand kit, robots, sitemap): cache for a day
    location ~* \.(png|svg|ico|txt|xml|zip|md)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    # Static pages only (/, /brand/, ...), no client-side routes: unknown paths are a real 404
    # (no soft-404 for crawlers)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
